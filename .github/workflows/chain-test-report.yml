name: Chain test report

on:
  workflow_run:
    workflows: ["Test all features"]
    types: [completed]

permissions: {}

# Serialize reports for the same PR branch, including reruns of one commit.
concurrency:
  group: chain-test-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # workflow_run grants write access. Execute only the default branch's code.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download chain test results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: release-gate-test-results-*
          path: ${{ runner.temp }}/chain-test-results

      - name: Update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS_DIR: ${{ runner.temp }}/chain-test-results
        run: python3 .github/scripts/chain_test_report.py
