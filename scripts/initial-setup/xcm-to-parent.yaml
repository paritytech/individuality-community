chain: people
tx:
  PolkadotXcm:
    send:
      dest:
        type: V3
        value:
          parents: 1
          interior:
            type: Here
            value: null
      message:
        type: V3
        value:
          - type: WithdrawAsset
            value:
              - id:
                  type: Concrete
                  value:
                    parents: 0
                    interior:
                      type: Here
                      value: null
                fun:
                  type: Fungible
                  value: 10000000000
          - type: BuyExecution
            value:
              fees:
                id:
                  type: Concrete
                  value:
                    parents: 0
                    interior:
                      type: Here
                      value: null
                fun:
                  type: Fungible
                  value: 10000000000
              weight_limit:
                type: Unlimited
                value: null
          - type: Transact
            value:
              origin_kind:
                type: Native
                value: null
              require_weight_at_most:
                ref_time: 2020000000
                proof_size: 10000
              call: ${CALL}
          - type: RefundSurplus
            value: null
          - type: DepositAsset
            value:
              assets:
                type: Wild
                value:
                  type: All
                  value: null
              beneficiary:
                parents: 0
                interior:
                  type: X1
                  value:
                    type: Parachain
                    value: ${PARACHAIN_ID}
