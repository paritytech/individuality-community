name: Notify gate failure
description: Tell the team room that chain-tests blocked a release, naming the failing suites.

inputs:
  kind:
    description: What was blocked, e.g. Release or Nightly.
    required: true
  access_token:
    description: Matrix access token.
    required: true
  room_id:
    description: Matrix room to post to.
    required: false
    default: "!llIELBsiHpuJTvtzhb:parity.io"

runs:
  using: composite
  steps:
    # Cattery re-runs a job that lost its runner, but only after this run
    # completes, so this job cannot see the retry. Needs `actions: read` and
    # `checks: read`.
    - name: Skip if only lost runners failed
      id: preempted
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
      run: |
        set -euo pipefail
        FAILED=$(gh api --paginate "$RUN_URL" --jq '.jobs[] | select(.conclusion == "failure") | .id')
        for JOB in $FAILED; do
          if ! gh api "repos/${{ github.repository }}/check-runs/$JOB/annotations" --jq '.[].message' \
            | grep -q "runner lost communication with the server"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "::notice::every failed job lost its runner; cattery re-runs them, so no alert is sent"
        echo "skip=true" >> "$GITHUB_OUTPUT"

    # The gate's junit lands in THIS run (a called workflow's jobs do), so the
    # failing suites can be named rather than just linked to.
    - name: Collect the gate's test results
      if: steps.preempted.outputs.skip != 'true'
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        pattern: release-gate-test-results-*
        path: gate-results

    - name: Compose the message
      if: steps.preempted.outputs.skip != 'true'
      id: msg
      shell: bash
      run: |
        set -euo pipefail
        FAILED=$(node -e '
          const fs = require("fs"), path = require("path");
          const walk = (d) => fs.existsSync(d) ? fs.readdirSync(d, {withFileTypes: true})
            .flatMap((e) => e.isDirectory() ? walk(path.join(d, e.name)) : [path.join(d, e.name)]) : [];
          const names = new Set();
          for (const f of walk("gate-results").filter((f) => f.endsWith(".xml"))) {
            const xml = fs.readFileSync(f, "utf8");
            for (const m of xml.matchAll(/<testsuite name="([^"]+)"[^>]*failures="([1-9]\d*)"/g)) {
              names.add(m[1].replace(/^src\/tests\//, ""));
            }
          }
          console.log([...names].join(", "));
        ')
        {
          echo "text<<GATEMSG"
          echo "[CRITICAL] E2E ${{ inputs.kind }} Tests Failed (${{ github.ref_name }})"
          if [ -n "$FAILED" ]; then
            echo "$FAILED"
          else
            echo "failed before the tests ran (fork spawn, or the runtime was refused)"
          fi
          echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "GATEMSG"
        } >> "$GITHUB_OUTPUT"

    - uses: s3krit/matrix-message-action@v0.0.3
      if: steps.preempted.outputs.skip != 'true'
      with:
        room_id: ${{ inputs.room_id }}
        access_token: ${{ inputs.access_token }}
        server: m.parity.io
        message: ${{ steps.msg.outputs.text }}
