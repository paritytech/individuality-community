name: Build runtimes

# Shared srtool build for the two paseo runtimes. Called by the manual Release
# and the nightly pre-release workflows so both ship identical artifacts.
on:
  workflow_call:
    inputs:
      spec-version:
        description: >-
          Spec version stamped into both runtimes before the build. Empty
          keeps the value committed on the built ref.
        type: string
        required: false
        default: ""

jobs:
  build-runtimes:
    runs-on: parity-large
    strategy:
      matrix:
        include:
          - name: next-people-paseo
            package: next-people-paseo-runtime
            path: runtimes/next-people-paseo
          - name: next-asset-hub-paseo
            package: next-asset-hub-paseo-runtime
            path: runtimes/next-asset-hub-paseo
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Stamp spec version
        if: inputs.spec-version != ''
        env:
          SPEC_VERSION: ${{ inputs.spec-version }}
        run: |
          set -euo pipefail

          if ! [[ "$SPEC_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::spec-version must be a number, got '$SPEC_VERSION'"
            exit 1
          fi

          # Workspace-only change carried into this build's artifacts; nothing
          # is committed or pushed. On main the last 3 digits stay zero.
          for f in runtimes/next-people-paseo/src/lib.rs runtimes/next-asset-hub-paseo/src/lib.rs; do
            lines=$(grep -cE '^[[:space:]]*spec_version: [0-9][0-9_]*,$' "$f")
            if [ "$lines" -ne 1 ]; then
              echo "::error::expected exactly one spec_version line in $f, found $lines"
              exit 1
            fi
            sed -i -E "s/^([[:space:]]*spec_version: )[0-9][0-9_]*,$/\1${SPEC_VERSION},/" "$f"
            grep -E '^[[:space:]]*spec_version: ' "$f"
          done

      - name: Build ${{ matrix.name }} runtime
        id: srtool_build
        uses: chevdor/srtool-actions@v0.9.2
        with:
          chain: ${{ matrix.name }}
          package: ${{ matrix.package }}
          runtime_dir: ${{ matrix.path }}
          profile: production

      - name: Store srtool digest
        env:
          SRTOOL_JSON: ${{ steps.srtool_build.outputs.json }}
        run: |
          printf '%s' "$SRTOOL_JSON" | jq > "${{ matrix.name }}_srtool_output.json"

      - name: Upload ${{ matrix.name }} wasm
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-runtime
          path: |
            ${{ steps.srtool_build.outputs.wasm_compressed }}
            ${{ matrix.name }}_srtool_output.json
