[package]
name = "indiv-precompile-nft-claims"
description = "Pallet-revive precompile registering Scarcity collections for NFT claims minting"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
frame-support = { workspace = true }
frame-system = { workspace = true }
indiv-pallet-nft-claims = { workspace = true }
indiv-precompile-support = { workspace = true }
pallet-revive = { workspace = true }
pallet-scarcity = { workspace = true }

[dev-dependencies]
codec = { workspace = true, features = ["derive"] }
indiv-precompile-fixtures = { workspace = true }
indiv-precompile-scarcity = { workspace = true }
indiv-precompile-support = { workspace = true, features = ["test-helpers"] }
indiv-support = { workspace = true }
pallet-balances = { workspace = true }
scale-info = { workspace = true, features = ["derive"] }
sp-io = { workspace = true }
sp-runtime = { workspace = true }
xcm = { workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-support/std",
	"frame-system/std",
	"indiv-pallet-nft-claims/std",
	"indiv-precompile-scarcity/std",
	"indiv-precompile-support/std",
	"indiv-support/std",
	"pallet-balances/std",
	"pallet-revive/std",
	"pallet-scarcity/std",
	"scale-info/std",
	"sp-io/std",
	"sp-runtime/std",
	"xcm/std",
]
runtime-benchmarks = [
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"indiv-pallet-nft-claims/runtime-benchmarks",
	"indiv-precompile-scarcity/runtime-benchmarks",
	"indiv-precompile-support/runtime-benchmarks",
	"indiv-support/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"pallet-revive/runtime-benchmarks",
	"pallet-scarcity/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
	"xcm/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"indiv-pallet-nft-claims/try-runtime",
	"indiv-precompile-scarcity/try-runtime",
	"indiv-precompile-support/try-runtime",
	"pallet-balances/try-runtime",
	"pallet-revive/try-runtime",
	"pallet-scarcity/try-runtime",
	"sp-runtime/try-runtime",
]
