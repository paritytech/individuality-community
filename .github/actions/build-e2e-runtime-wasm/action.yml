name: Build E2E runtime WASM
description: Build and upload the runtime WASM artifacts used by E2E checks.

inputs:
  artifact-name:
    description: Artifact name for the built runtime WASM files.
    required: false
    default: e2e-runtime-wasm
  artifact-dir:
    description: Directory where the runtime WASM files are staged before upload.
    required: false
    default: .artifacts/e2e-runtime-wasm

runs:
  using: composite
  steps:
    - name: Install updates and protobuf-compiler
      run: sudo apt update && sudo apt install --assume-yes cmake protobuf-compiler build-essential clang
      shell: bash

    - name: Load common env file
      run: cat .github/env >> "$GITHUB_ENV"
      shell: bash

    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
      with:
        cache: false

    - name: Install solc and resolc
      run: |
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"

        curl -sL --fail -o "$HOME/.local/bin/solc" \
          "https://github.com/ethereum/solidity/releases/download/v${{ env.SOLC_VERSION }}/solc-static-linux"
        chmod +x "$HOME/.local/bin/solc"
        solc --version

        curl -L --fail -o "$HOME/.local/bin/resolc" \
          "https://github.com/paritytech/revive/releases/download/v${{ env.RESOLC_VERSION }}/resolc-x86_64-unknown-linux-musl"
        chmod +x "$HOME/.local/bin/resolc"
        resolc --version
      shell: bash

    - name: Fetch cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: individuality-cache-e2e-runtime-wasm

    # A runtime upgrade only executes when spec_version strictly INCREASES. A
    # build straight from source carries the committed value, which is what the
    # chain already runs — so the gate saw "2000039 -> 2000039", reported
    # already-installed and tested nothing about this PR's code.
    #
    # Multiplying by 100 keeps the committed digits visible in the result
    # (2_000_039 -> 200_003_900), so it is obvious in a log which build a chain
    # is running. Nothing is committed back: the edit lives in the build
    # workspace, and these artifacts are never released.
    - name: Stamp a strictly-greater spec_version
      run: |
        set -euo pipefail
        for lib in runtimes/next-asset-hub-paseo/src/lib.rs runtimes/next-people-paseo/src/lib.rs; do
          # sed captures only the number: a bare [0-9_]+ grep also matches the
          # underscore inside "spec_version" itself.
          BASE=$(sed -nE 's/.*spec_version:[[:space:]]*([0-9_]+).*/\1/p' "$lib" | head -1 | tr -d '_')
          [ -n "$BASE" ] || { echo "::error::no spec_version found in $lib"; exit 1; }
          STAMP=$((BASE * 100))
          GROUPED=$(sed -E 's/(.{3})(.{3})(.{3})/\1_\2_\3/' <<< "$STAMP")
          sed -i -E "s/spec_version:[[:space:]]*[0-9_]+/spec_version: ${GROUPED}/" "$lib"
          echo "  $lib: $BASE -> $GROUPED"
        done
      shell: bash

    - name: Build E2E runtime WASM artifacts
      run: cargo build --release -p next-people-paseo-runtime -p next-asset-hub-paseo-runtime --locked
      shell: bash

    - name: Stage E2E runtime WASM artifacts
      run: |
        mkdir -p "${{ inputs.artifact-dir }}"
        cp target/release/wbuild/next-people-paseo-runtime/next_people_paseo_runtime.wasm \
          "${{ inputs.artifact-dir }}/next_people_paseo_runtime.wasm"
        cp target/release/wbuild/next-asset-hub-paseo-runtime/next_asset_hub_paseo_runtime.wasm \
          "${{ inputs.artifact-dir }}/next_asset_hub_paseo_runtime.wasm"
        # The compressed variants too. An on-chain upgrade takes the compressed
        # blob — the plain one is roughly three times the size and can exceed the
        # block limit on set_code. wbuild already produces both.
        cp target/release/wbuild/next-people-paseo-runtime/next_people_paseo_runtime.compact.compressed.wasm \
          "${{ inputs.artifact-dir }}/next_people_paseo_runtime.compact.compressed.wasm"
        cp target/release/wbuild/next-asset-hub-paseo-runtime/next_asset_hub_paseo_runtime.compact.compressed.wasm \
          "${{ inputs.artifact-dir }}/next_asset_hub_paseo_runtime.compact.compressed.wasm"
      shell: bash

    - name: Upload E2E runtime WASM artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-dir }}
        retention-days: 1 # shortest explicit retention
