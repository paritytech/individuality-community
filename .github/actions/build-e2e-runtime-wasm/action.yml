name: Build E2E runtime WASM
description: Build and upload the runtime WASM artifacts used by E2E checks.

inputs:
  artifact-name:
    description: Artifact name for the built runtime WASM files.
    required: false
    default: e2e-runtime-wasm
  artifact-dir:
    description: Directory where the runtime WASM files are staged before upload.
    required: false
    default: .artifacts/e2e-runtime-wasm

runs:
  using: composite
  steps:
    - name: Install updates and protobuf-compiler
      run: sudo apt update && sudo apt install --assume-yes cmake protobuf-compiler build-essential clang
      shell: bash

    - name: Load common env file
      run: cat .github/env >> "$GITHUB_ENV"
      shell: bash

    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
      with:
        cache: false

    - name: Install solc and resolc
      run: |
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"

        curl -sL --fail -o "$HOME/.local/bin/solc" \
          "https://github.com/ethereum/solidity/releases/download/v${{ env.SOLC_VERSION }}/solc-static-linux"
        chmod +x "$HOME/.local/bin/solc"
        solc --version

        curl -L --fail -o "$HOME/.local/bin/resolc" \
          "https://github.com/paritytech/revive/releases/download/v${{ env.RESOLC_VERSION }}/resolc-x86_64-unknown-linux-musl"
        chmod +x "$HOME/.local/bin/resolc"
        resolc --version
      shell: bash

    - name: Fetch cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: individuality-cache-e2e-runtime-wasm

    # A build from source carries whatever is committed, which can be BEHIND the
    # deployed networks: a release bumps the value on main, so a branch cut before
    # it stamps below what previewnet already runs and the gate rejects the
    # downgrade. Stamp above the higher of the two. +1 lands in the YYY band
    # RELEASE.md reserves for nightlies.
    #
    # Workspace-only change carried into this build's artifacts; nothing is
    # committed or pushed. See e2e/README.md for more details.
    - name: Bump spec version
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail

        latest=$(.github/scripts/latest_release_spec_version.sh || true)
        [ -n "$latest" ] && echo "newest release spec_version: $latest" \
          || echo "no readable release spec_version; using the committed values"

        for f in runtimes/next-people-paseo/src/lib.rs runtimes/next-asset-hub-paseo/src/lib.rs; do
          lines=$(grep -cE '^[[:space:]]*spec_version: [0-9][0-9_]*,$' "$f")
          if [ "$lines" -ne 1 ]; then
            echo "::error::expected exactly one spec_version line in $f, found $lines"
            exit 1
          fi
          spec_version=$(grep -hE '^[[:space:]]*spec_version: [0-9][0-9_]*,$' "$f" \
            | grep -oE '[0-9][0-9_]*' | tr -d '_')
          floor=$spec_version
          [ -n "$latest" ] && [ "$latest" -gt "$floor" ] && floor=$latest
          sed -i -E "s/^([[:space:]]*spec_version: )[0-9][0-9_]*,$/\1$((floor + 1)),/" "$f"
          grep -E '^[[:space:]]*spec_version: ' "$f"
        done
      shell: bash

    # production (lto, codegen-units=1) is the profile srtool uses for releases.
    # --release put people over the relay's 3 MiB max_code_size, so the chain
    # refused the upgrade with parachain_system TooBig.
    - name: Build E2E runtime WASM artifacts
      run: cargo build --profile production -p next-people-paseo-runtime -p next-asset-hub-paseo-runtime --locked
      shell: bash

    - name: Stage E2E runtime WASM artifacts
      run: |
        mkdir -p "${{ inputs.artifact-dir }}"
        cp target/production/wbuild/next-people-paseo-runtime/next_people_paseo_runtime.wasm \
          "${{ inputs.artifact-dir }}/next_people_paseo_runtime.wasm"
        cp target/production/wbuild/next-asset-hub-paseo-runtime/next_asset_hub_paseo_runtime.wasm \
          "${{ inputs.artifact-dir }}/next_asset_hub_paseo_runtime.wasm"
        # The compressed variants too — an on-chain upgrade takes those, and they
        # must stay under the relay's max_code_size (3 MiB) or the chain refuses.
        cp target/production/wbuild/next-people-paseo-runtime/next_people_paseo_runtime.compact.compressed.wasm \
          "${{ inputs.artifact-dir }}/next_people_paseo_runtime.compact.compressed.wasm"
        cp target/production/wbuild/next-asset-hub-paseo-runtime/next_asset_hub_paseo_runtime.compact.compressed.wasm \
          "${{ inputs.artifact-dir }}/next_asset_hub_paseo_runtime.compact.compressed.wasm"

        echo "staged (relay max_code_size is 3145728 bytes):"
        ls -l "${{ inputs.artifact-dir }}"
      shell: bash

    - name: Upload E2E runtime WASM artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-dir }}
        retention-days: 1 # shortest explicit retention
