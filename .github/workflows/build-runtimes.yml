name: Build runtimes

# Shared srtool build for the two paseo runtimes. Called by the manual Release
# and the nightly pre-release workflows so both ship identical artifacts.
on:
  workflow_call:

jobs:
  build-runtimes:
    runs-on: parity-int-ubuntu
    strategy:
      matrix:
        include:
          - name: next-people-paseo
            package: next-people-paseo-runtime
            path: runtimes/next-people-paseo
          - name: next-asset-hub-paseo
            package: next-asset-hub-paseo-runtime
            path: runtimes/next-asset-hub-paseo
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build ${{ matrix.name }} runtime
        id: srtool_build
        uses: chevdor/srtool-actions@v0.9.2
        with:
          chain: ${{ matrix.name }}
          package: ${{ matrix.package }}
          runtime_dir: ${{ matrix.path }}
          profile: production

      - name: Store srtool digest
        run: |
          echo '${{ steps.srtool_build.outputs.json }}' | jq > ${{ matrix.name }}_srtool_output.json

      - name: Upload ${{ matrix.name }} wasm
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-runtime
          path: |
            ${{ steps.srtool_build.outputs.wasm_compressed }}
            ${{ matrix.name }}_srtool_output.json
