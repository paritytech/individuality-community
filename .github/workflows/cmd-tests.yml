name: Command Bot Tests

# The `/cmd` bot is not live yet (cmd.yml has to land on the default branch before
# issue_comment triggers it), so this suite runs on demand only and does not gate
# pull requests. Restore the `pull_request` trigger together with `/cmd`:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cmd-bot:
    runs-on: parity-ubuntu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 .github/scripts/cmd/test_cmd.py
